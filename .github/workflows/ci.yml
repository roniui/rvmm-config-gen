name: CI
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear older runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' |
            tail -n+11 |
            xargs -r -n1 gh api "repos/${GITHUB_REPOSITORY}/actions/runs/ID" -X DELETE || :

      - name: Generate Morphe patch data
        run: |
          set -euo pipefail

          r=$(curl -fsSL https://api.github.com/repos/morpheApp/morphe-patches/releases/latest)
          name=$(echo "$r" | jq -er '.assets[] | select(.name | endswith(".mpp")) | .name')
          version_name="${name%.mpp}"

          curl -fsSL \
            https://raw.githubusercontent.com/MorpheApp/morphe-patches/main/patches-list.json \
            -o /tmp/morphe-patches.json

          jq --arg version "${version_name#patches-}" '
            {
              NOTE: "Do NOT manually edit this file. It is generated automatically.",
              version: $version,
              patches: [
                .patches[] |
                . as $patch |
                {
                  name: $patch.name,
                  description: $patch.description,
                  use: $patch.use,
                  default: $patch["default"],
                  compatiblePackages: (
                    reduce ($patch.compatiblePackages // [])[] as $pkg
                      ({}; . + {
                        ($pkg.packageName): [
                          ($pkg.targets // [])[]?.version
                        ]
                      })
                  ),
                  options: ($patch.options // [])
                }
              ]
            }
          ' /tmp/morphe-patches.json > docs/patches.json

          echo -n "${version_name#patches-}" > docs/version

      - name: patches
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: master
          file_pattern: docs/patches.json docs/version
          commit_message: "Update patches.json"
