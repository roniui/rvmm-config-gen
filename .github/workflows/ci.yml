name: CI
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear older runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' |
            tail -n+11 |
            xargs -r -n1 gh api "repos/${GITHUB_REPOSITORY}/actions/runs/ID" -X DELETE || :

      - name: Generate JSON
        run: |
          set -euo pipefail

          # Fetch the release metadata and generated patch list directly from Morphe.
          r=$(curl -fsSL https://api.github.com/repos/morpheApp/morphe-patches/releases/latest)

          name=$(echo "$r" | jq -er '.assets[] | select(.name | endswith(".mpp")) | .name')
          version_name="${name%.*}"

          curl -fsSL \
            https://raw.githubusercontent.com/MorpheApp/morphe-patches/main/patches-list.json \
            -o docs/patches.json

          if [ -s docs/patches.json ] &&
             jq -e 'type == "array"' docs/patches.json >/dev/null &&
             [ "$version_name" = "$(cat docs/version 2>/dev/null || true)" ]; then
            exit 0
          fi

          echo -n "$version_name" > docs/version

      - name: patches
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: master
          file_pattern: docs/patches.json docs/version
          commit_message: "Update patches.json"
